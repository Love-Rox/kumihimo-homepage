name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      # Compiles every .khm example with the published package and fails on any
      # diagnostic the example does not declare — the site must neither ship a picture
      # of faulty wiring nor call a sound diagram faulty.
      - run: pnpm diagrams

      - run: pnpm typecheck

      - run: pnpm build
