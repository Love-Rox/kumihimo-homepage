name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Compiles every .khm example with the published package and fails on any
      # unexpected diagnostic — the site must not ship a picture of faulty wiring.
      - run: pnpm diagrams

      - run: pnpm typecheck

      - run: pnpm build
